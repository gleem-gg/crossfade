name: Release assets

# Builds and checks the release, then attaches a `cargo vendor` tarball
# (for offline distro builds) and checksums to the GitHub release.
# Releases themselves are still created manually with `gh release create`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    if: github.repository == 'gleem-gg/crossfade'
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: >
          dnf -y install cargo rust clippy gcc gtk4-devel libadwaita-devel
          pulseaudio-libs-devel alsa-lib-devel desktop-file-utils make
          git-core gh tar xz jq

      - uses: actions/checkout@v5

      - name: Check
        run: make check

      - name: Build
        run: cargo build --release --locked

      - name: Create vendor tarball
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          cargo vendor --locked vendor >/dev/null
          tar -cJf "gleem-crossfade-$version-vendor.tar.xz" vendor
          sha256sum "gleem-crossfade-$version-vendor.tar.xz" > SHA256SUMS

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          gleem-crossfade-*-vendor.tar.xz SHA256SUMS
          --clobber -R "${{ github.repository }}"

      - name: Announce on Discord
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          PUBLISHED: ${{ github.event.release.published_at }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping announcement"
            exit 0
          fi
          # Discord embeds don't render markdown headings; turn them into bold
          notes=$(printf '%s' "$BODY" | sed -E 's/^#{1,3} +(.*)/**\1**/')
          jq -n --arg tag "$TAG" --arg url "$URL" --arg notes "$notes" --arg ts "$PUBLISHED" '
            {content: "🚀 **Gleem Crossfade \($tag) is out!**",
             embeds: [{
               title: "Gleem Crossfade \($tag)",
               url: $url,
               description: ($notes | if length > 4096 then .[:4093] + "…" else . end),
               color: 5793266,
               fields: [
                 {name: "📥 Get it",
                  value: "```sh\ngit clone https://github.com/gleem-gg/crossfade\ncd crossfade && make install\n```",
                  inline: true},
                 {name: "🔗 Links",
                  value: "[Release notes](\($url))\n[Report an issue](https://github.com/gleem-gg/crossfade/issues)",
                  inline: true}
               ],
               image: {url: "https://raw.githubusercontent.com/gleem-gg/crossfade/main/img.png"},
               footer: {text: "Gleem Crossfade — dual-mix virtual audio mixer for Linux • MIT"},
               timestamp: $ts
             }]}' \
          | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"

  aur:
    name: Publish to AUR
    # Only publish what passed `make check` and the release build
    needs: assets
    if: github.repository == 'gleem-gg/crossfade' && github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for AUR key
        id: key
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set, skipping AUR publish"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'

      # The tagged PKGBUILD can't hold the checksum of its own tag's tarball, so
      # the version comes from the tag and updpkgsums fills in the checksum.
      - name: Set PKGBUILD version
        if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${TAG#v}/" -e 's/^pkgrel=.*/pkgrel=1/' \
            packaging/aur/PKGBUILD

      # The action regenerates .SRCINFO itself
      - name: Publish to AUR
        if: steps.key.outputs.present == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: gleem-crossfade
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: GitHub Actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.event.release.tag_name }}"
          updpkgsums: true
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
